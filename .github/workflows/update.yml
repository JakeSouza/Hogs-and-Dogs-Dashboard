name: Update Dashboard

on:
  schedule:
    - cron: "0 13 * * *"   # daily ~09:00 ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate dashboard
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          HISTORY_START_YEAR: ${{ secrets.HISTORY_START_YEAR }}
        run: python sleeper_dashboard.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update dashboard $(date -u +%F)" || echo "no changes"
          git push

